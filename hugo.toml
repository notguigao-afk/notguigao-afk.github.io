baseURL = 'https://notguigao-afk.github.io/'
# Prefer zh so dates/meta render consistently (PaperMod uses site language)
defaultContentLanguage = 'zh-cn'
locale = 'zh-CN'
title = '/dev/null'
theme = 'PaperMod'

# Main navigation — category pages and about
[[menu.main]]
  name = '首页'
  url = '/'
  weight = 1

[[menu.main]]
  name = '随笔'
  url = '/categories/essays/'
  weight = 2

[[menu.main]]
  name = '拾遗'
  url = '/categories/gleanings/'
  weight = 3

[[menu.main]]
  name = '不想上班'
  url = '/categories/moments/'
  weight = 4

[[menu.main]]
  name = '关于'
  url = '/about/'
  weight = 5

# Allow semantic HTML in About colophon etc.
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  mainSections = ['posts']
  DateFormat = '2006年1月2日'
  ShowCodeCopyButtons = true

  [params.assets]
    favicon = "favicon.ico"
    favicon16x16 = "favicon-16x16.png"
    favicon32x32 = "favicon-32x32.png"
    apple_touch_icon = "apple-touch-icon.png"
    safari_pinned_tab = "safari-pinned-tab.svg"
    theme_color = "#f7f5f0"
    msapplication_TileColor = "#292622"

  [params.journal]
    tagline = "记下生活，也留下学过的。"
