baseURL = 'https://notguigao-afk.github.io/'
languageCode = 'zh-cn'
title = '我的个人博客'
theme = 'PaperMod'

[params]
  # Landing hero — English quote (parallel lines, not translated)
  [params.homeHero]
    quoteLines = [
      "Live as if you were to die tomorrow.",
      "Learn as if you were to live forever."
    ]
    # Site line under the quote (Chinese, not a translation of the quote)
    tagline = "记下生活，也留下学过的。"

  # Recent posts on home
  [params.homeRecent]
    count = 5

  # Short about on home
  [params.homeAbout]
    title = "关于"
    body = "这里有两类文字：随笔写生活与思考，拾遗记学习与经验。写得慢一点，也写得真一点。"

  ShowCodeCopyButtons = true
