baseURL = 'https://notguigao-afk.github.io/'
# Prefer zh so dates/meta render consistently (PaperMod uses site language)
defaultContentLanguage = 'zh-cn'
languageCode = 'zh-cn'
title = '/dev/null'
theme = 'PaperMod'

# Top tab navigation — each tab is a page, no scroll sections on home
[[menu.main]]
  name = '首页'
  url = '/'
  weight = 1

[[menu.main]]
  name = '随笔'
  url = '/categories/随笔/'
  weight = 2

[[menu.main]]
  name = '拾遗'
  url = '/categories/拾遗/'
  weight = 3

[[menu.main]]
  name = '不想上班'
  url = '/categories/不想上班/'
  weight = 4

[[menu.main]]
  name = '关于'
  url = '/about/'
  weight = 5

# Allow semantic HTML in About colophon etc.
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  mainSections = ['posts']
  DateFormat = '2006年1月2日'
  ShowCodeCopyButtons = true

  [params.assets]
    favicon = "favicon.ico"
    favicon16x16 = "favicon-16x16.png"
    favicon32x32 = "favicon-32x32.png"
    apple_touch_icon = "apple-touch-icon.png"
    safari_pinned_tab = "safari-pinned-tab.svg"
    theme_color = "#f4f0e8"
    msapplication_TileColor = "#1c1917"

  [params.homeHero]
    quoteLines = [
      "Live as if you were to die tomorrow.",
      "Learn as if you were to live forever."
    ]
    tagline = "记下生活，也留下学过的。"
